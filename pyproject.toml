[build-system]
requires = ["scikit-build-core>=0.5.0", "pybind11>=2.10.0", "cmake>=3.15"]
build-backend = "scikit_build_core.build"

[project]
name = "isage-tsdb"
dynamic = ["version"]
description = "High-Performance Time Series Database with C++ Core"
readme = "README.md"
authors = [{ name = "Debin Chen" }]
maintainers = [{ name = "Debin Chen" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: C++",
]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26.0,<2.3.0"]

[project.optional-dependencies]
full = []
intelligence = ["torch>=1.13"]
dev = ["isage-tsdb[full]", "pytest>=7.0.0", "pytest-cov>=4.0.0", "ruff>=0.1.0"]

[project.urls]
Homepage = "https://github.com/intellistream/sageTSDB"
Repository = "https://github.com/intellistream/sageTSDB.git"
"Bug Tracker" = "https://github.com/intellistream/sageTSDB/issues"

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["sage_tsdb"]
wheel.py-api = "py311"

# Configure for manylinux compatibility
[tool.cibuildwheel]
build = ["cp310-*", "cp311-*", "cp312-*"]
skip = ["*-musllinux_*"]
manylinux-x86_64-image = "manylinux2014"
build-verbosity = 1

[tool.cibuildwheel.linux]
before-build = [
    "yum install -y cmake3 gcc-c++ make",
    "ln -sf /usr/bin/cmake3 /usr/bin/cmake || true",
]
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "sage_tsdb/_version.py"
regex = "__version__ = [\"']([^\"']+)[\"']"
result = "{0}"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Keep all pytest settings here so local runs and CI use the same configuration.
addopts = [
    "-v", "--strict-markers", "--tb=short", "--disable-warnings",
    "--cov=sage_tsdb", "--cov-report=term-missing", "--cov-report=html:htmlcov",
]
log_cli = true
log_cli_level = "INFO"
log_file = "pytest.log"
log_file_level = "DEBUG"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests (use -m 'not slow' to skip)",
    "gpu: Tests requiring GPU",
    "cpp: Tests for C++ bindings",
]
norecursedirs = [
    ".git", ".tox", "dist", "build*", "*.egg", "vendors", "third_party",
]
