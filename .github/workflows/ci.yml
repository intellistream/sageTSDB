name: CI

on:
  push:
    branches: [main, main-dev, feature]
  pull_request:
    branches: [main, main-dev, feature]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CMAKE_GENERATOR: Ninja
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  cpp-default:
    name: C++ Default (${{ matrix.os }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            libfmt-dev \
            libspdlog-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake ninja fmt spdlog

      - name: Configure
        run: |
          cmake -B build -S . -G "${CMAKE_GENERATOR}" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_TESTS=ON \
            -DBUILD_PLUGINS=ON \
            -DSAGE_TSDB_ENABLE_SRTFD=ON \
            -DSAGE_TSDB_ENABLE_PECJ=OFF

      - name: Build
        run: |
          if command -v nproc >/dev/null 2>&1; then
            jobs=$(nproc)
          else
            jobs=$(sysctl -n hw.ncpu)
          fi
          cmake --build build --config ${{ matrix.build_type }} -j "${jobs}"

      - name: Run CTest
        run: ctest --test-dir build --output-on-failure

      - name: Upload CTest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-default-${{ matrix.os }}-${{ matrix.build_type }}
          path: build/Testing/
          if-no-files-found: ignore

  cpp-pecj-integrated:
    name: C++ PECJ Integrated API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            libfmt-dev \
            libspdlog-dev

      - name: Configure PECJ integrated stub build
        run: |
          cmake -B build -S . -G "${CMAKE_GENERATOR}" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DBUILD_PLUGINS=ON \
            -DSAGE_TSDB_ENABLE_SRTFD=ON \
            -DSAGE_TSDB_ENABLE_PECJ=ON \
            -DPECJ_MODE=INTEGRATED \
            -DPECJ_FULL_INTEGRATION=OFF

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Run CTest
        run: ctest --test-dir build --output-on-failure

      - name: Verify compute test registration
        run: |
          ctest --test-dir build -N | grep "SRTFDComputeEngineTest"
          ctest --test-dir build -N | grep "PECJComputeEngineTest"

      - name: Upload CTest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-pecj-integrated
          path: build/Testing/
          if-no-files-found: ignore

  python-tests:
    name: Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy>=1.26.0,<2.3.0' \
            'pytest>=7.0.0' \
            'pytest-cov>=4.0.0' \
            coverage

      - name: Run pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests -q

      - name: Upload pytest coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-htmlcov-${{ matrix.python-version }}
          path: htmlcov/
          if-no-files-found: ignore

  cpp-coverage:
    name: C++ Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            lcov \
            libfmt-dev \
            libspdlog-dev

      - name: Configure coverage build
        run: |
          cmake -B build-coverage -S . -G "${CMAKE_GENERATOR}" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DBUILD_PLUGINS=ON \
            -DSAGE_TSDB_ENABLE_SRTFD=ON \
            -DSAGE_TSDB_ENABLE_PECJ=OFF \
            -DENABLE_COVERAGE=ON \
            -DCMAKE_CXX_FLAGS="-O0 --coverage -fprofile-arcs -ftest-coverage -g"

      - name: Build
        run: cmake --build build-coverage -j "$(nproc)"

      - name: Run CTest
        run: ctest --test-dir build-coverage --output-on-failure

      - name: Generate lcov report
        run: |
          LCOV_IGNORE_ERRORS="mismatch,empty,unused"
          lcov --capture --directory build-coverage --output-file coverage.info \
            --ignore-errors "${LCOV_IGNORE_ERRORS}" \
            --rc geninfo_unexecuted_blocks=1
          lcov --remove coverage.info \
            '/usr/*' \
            '*/tests/*' \
            '*/build-coverage/_deps/*' \
            '*/_deps/*' \
            --output-file coverage.info.filtered \
            --ignore-errors "${LCOV_IGNORE_ERRORS}"
          lcov --list coverage.info.filtered --ignore-errors empty,unused

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpp-coverage-lcov
          path: coverage.info.filtered
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.info.filtered
          fail_ci_if_error: false
          verbose: true

